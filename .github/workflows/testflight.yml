name: TestFlight

# Archives with automatic signing through the App Store Connect API key, then exports and
# uploads to TestFlight. CI creates and updates certificates and profiles as needed (Admin key).
on:
  push:
    tags: ["v*"]
    branches: [ci/testflight] # TEMP: dry run; removed before merge
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (off: archive and export only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: swift test

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Model
          key: model-${{ hashFiles('scripts/model-manifest.txt') }}

      - name: Fetch model
        run: scripts/fetch-model.sh

      # Secrets may arrive with flattened newlines; rebuild a valid PEM.
      - name: API key
        env:
          P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
        run: |
          dir="$RUNNER_TEMP/asc"; mkdir -p "$dir"; chmod 700 "$dir"
          body="$(printf '%s' "$P8" | sed -E 's/-----[A-Z ]+-----//g' | tr -d ' \n\r\t')"
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$dir/AuthKey_${KEY_ID}.p8"
          chmod 600 "$dir/AuthKey_${KEY_ID}.p8"
          echo "ASC_KEY_PATH=$dir/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive -project DictatorIOS.xcodeproj -scheme DictatorIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Dictator.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export or upload
        env:
          KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dest=export; [[ "$UPLOAD" == "true" ]] && dest=upload
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${dest}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dictator.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Build $BUILD_NUMBER: $dest done" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
