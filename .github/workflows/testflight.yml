name: TestFlight

# Archives with automatic signing through the App Store Connect API key, then exports and
# uploads to TestFlight. CI creates and updates certificates and profiles as needed (Admin key).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (off: archive and export only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: swift test

      # Secrets may arrive with flattened newlines; rebuild a valid PEM.
      - name: API key
        env:
          P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
        run: |
          dir="$RUNNER_TEMP/asc"; mkdir -p "$dir"; chmod 700 "$dir"
          body="$(printf '%s' "$P8" | sed -E 's/-----[A-Z ]+-----//g' | tr -d ' \n\r\t')"
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$dir/AuthKey_${KEY_ID}.p8"
          chmod 600 "$dir/AuthKey_${KEY_ID}.p8"
          echo "ASC_KEY_PATH=$dir/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      # Throwaway keychain and profiles for this job only.
      - name: Signing assets
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.APPLE_PROFILE_APP_BASE64 }}
          PROFILE_KB: ${{ secrets.APPLE_PROFILE_KEYBOARD_BASE64 }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(uuidgen)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          pdir="$HOME/Library/MobileDevice/Provisioning Profiles"; mkdir -p "$pdir"
          for x in APP KB; do
            var="PROFILE_$x"; f="$RUNNER_TEMP/$x.mobileprovision"
            printf '%s' "${!var}" | base64 --decode > "$f"
            uuid="$(security cms -D -i "$f" | plutil -extract UUID raw -)"
            cp "$f" "$pdir/$uuid.mobileprovision"
          done

      # The project uses automatic signing for local development; CI pins the App Store profiles.
      - name: Pin profiles
        run: |
          sed -i '' \
            -e 's/PRODUCT_BUNDLE_IDENTIFIER = com.captainduckay.dictator.ios;/&\
          PROVISIONING_PROFILE_SPECIFIER = "Dictator iOS App Store";/' \
            -e 's/PRODUCT_BUNDLE_IDENTIFIER = com.captainduckay.dictator.ios.keyboard;/&\
          PROVISIONING_PROFILE_SPECIFIER = "Dictator Keyboard App Store";/' \
            DictatorIOS.xcodeproj/project.pbxproj
          test "$(grep -c PROVISIONING_PROFILE_SPECIFIER DictatorIOS.xcodeproj/project.pbxproj)" -eq 4

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive -project DictatorIOS.xcodeproj -scheme DictatorIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Dictator.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export or upload
        env:
          KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dest=export; [[ "$UPLOAD" == "true" ]] && dest=upload
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${dest}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.captainduckay.dictator.ios</key><string>Dictator iOS App Store</string>
              <key>com.captainduckay.dictator.ios.keyboard</key><string>Dictator Keyboard App Store</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dictator.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Build $BUILD_NUMBER: $dest done" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up key
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true
