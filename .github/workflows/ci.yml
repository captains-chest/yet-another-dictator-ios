name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      # Fails if Package.resolved is out of sync with Package.swift.
      - name: Resolve dependencies
        run: swift package resolve --force-resolved-versions

      # Package tests run on the macOS host, including the keyboard hand-off. The model is not fetched.
      - name: Test
        run: swift test

      - name: Build (iOS)
        run: xcodebuild build -scheme DictatorIOS -destination 'generic/platform=iOS' -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
